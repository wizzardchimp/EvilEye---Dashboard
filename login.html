<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvilEye · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/angry-eye.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="logo"><img src="/static/angry-eye.svg" width="32" height="32" alt="EvilEye"></span>
      <div>
        <h1>EvilEye</h1>
        <p class="tagline">the private eye on the patch</p>
      </div>
    </div>
    <form method="post" action="/login" class="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const MSG = {
      "1": "Incorrect username or password.",
      "2": "Too many failed attempts. Try again in 15 minutes.",
      "3": "The user database is unavailable. Try again shortly."
    };
    const code = new URLSearchParams(location.search).get("error");
    if (code) {
      const el = document.getElementById("login-error");
      el.textContent = MSG[code] || MSG["1"];
      el.hidden = false;
      document.getElementById("password").focus();
    }
  </script>
</body>
</html>
